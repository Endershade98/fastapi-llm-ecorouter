services:
  quality:
    build:
      context: ..
      dockerfile: docker/Dockerfile
  postgres:
    image: postgres:16
    profiles: [integration]
    environment:
      POSTGRES_USER: ecorouter
      POSTGRES_PASSWORD: ecorouter-test
      POSTGRES_DB: ecorouter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorouter -d ecorouter"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
